<html lang="en">
<head>

<title>Marketing Material Design Services — Lissia Design LLC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f8fa;color:#333;min-height:100vh}
header{background:#0d2b45;padding:20px 24px;color:#fff}
header h1{font-size:22px;font-weight:900}
header p{font-size:13px;color:#12b3cc;margin-top:4px}
.tab-bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tab-bar button{background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:6px;padding:7px 16px;cursor:pointer;font-weight:700;font-size:12px}
.tab-bar button.active{background:rgba(255,255,255,.25)}
.container{max-width:1200px;margin:0 auto;padding:24px 16px}
.filter-bar{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:20px;box-shadow:0 1px 6px rgba(0,0,0,.06);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-bar input{border:1px solid #cde;border-radius:6px;padding:7px 12px;font-size:12px;min-width:200px;outline:none}
.pill{border:none;border-radius:20px;padding:5px 13px;cursor:pointer;font-size:10px;font-weight:700;background:#eee;color:#0d2b45}
.pill.active{background:#0a7b8c;color:#fff}
.pill.bundle.active{background:#f0c040;color:#0d2b45}
.count{font-size:12px;color:#888;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden;display:flex;flex-direction:column;border:1px solid #dce8ec}
.card.bundle{border:2px solid #f0c040}
.bundle-banner{background:#f0c040;color:#0d2b45;text-align:center;font-size:10px;font-weight:800;padding:3px 0;letter-spacing:1px}
.card-body{padding:16px 16px 0;flex:1}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;margin-bottom:6px}
.card-title{font-weight:800;color:#0d2b45;font-size:14px;margin-bottom:6px}
.card-meta{display:flex;gap:12px;font-size:11px;color:#777;margin-bottom:8px}
.card-desc{font-size:12px;color:#555;line-height:1.6;margin-bottom:8px}
.bundle-inc{background:#f0f8fa;border-radius:6px;padding:6px 10px;font-size:11px;color:#555;margin-bottom:8px}
.card-price{font-size:19px;font-weight:900;color:#0a7b8c}
.card-footer{padding:12px 16px}
.toggle-btn{width:100%;background:none;border:1px solid #0a7b8c;color:#0a7b8c;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px;margin-bottom:8px;font-weight:600}
.details{font-size:11px;color:#444;margin-bottom:10px;display:none}
.details.open{display:block}
.details h4{font-weight:700;color:#0d2b45;margin:8px 0 4px}
.details li{padding-left:12px;margin-bottom:2px;list-style:disc;list-style-position:inside}
.addon-item{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;font-size:11px}
.add-btn{width:100%;background:#0a7b8c;color:#fff;border:none;border-radius:8px;padding:10px;cursor:pointer;font-weight:800;font-size:13px}
.add-btn.added{background:#2ec27a}
#cart-fab{position:fixed;bottom:24px;right:24px;z-index:200;background:#0d2b45;color:#fff;border:none;border-radius:50px;padding:13px 22px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:14px}
#cart-panel{position:fixed;bottom:72px;right:24px;z-index:200;background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.15);width:320px;max-height:420px;overflow-y:auto;padding:16px;display:none}
#cart-panel.open{display:block}
#cart-panel h3{font-weight:800;color:#0d2b45;margin-bottom:12px}
.cart-item{border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:10px}
.cart-item-name{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#0d2b45}
.cart-addon{display:flex;justify-content:space-between;font-size:11px;color:#666;padding-left:10px}
.remove-btn{background:none;border:none;color:#e05050;cursor:pointer;font-size:11px;padding:0;margin-top:3px}
.cart-total{display:flex;justify-content:space-between;font-weight:800;color:#0d2b45;font-size:14px;padding-top:8px;border-top:2px solid #eee;margin-top:8px}
.checkout-btn{width:100%;background:#2ec27a;color:#fff;border:none;border-radius:8px;padding:11px;font-weight:800;cursor:pointer;margin-top:10px;font-size:13px}
.sec{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid #dce8ec}
.sec-title{font-weight:800;color:#0d2b45;font-size:15px;margin-bottom:14px;border-bottom:2px solid #0a7b8c;padding-bottom:6px}
.admin-table{width:100%;border-collapse:collapse;font-size:12px}
.admin-table th{background:#f0f8fa;padding:9px 12px;text-align:left;color:#0d2b45;font-weight:700;border-bottom:2px solid #0a7b8c}
.admin-table td{padding:8px 12px;border-bottom:1px solid #f0f0f0}
.checklist label{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px;font-size:12px;cursor:pointer;line-height:1.5}
.no-results{text-align:center;color:#aaa;padding:60px;font-size:16px}
@media(max-width:600px){.grid{grid-template-columns:1fr}header h1{font-size:17px}}
</style>
</head>

var activeFilter='ALL',cart={},expanded={},addons={};
function setFilter(f,btn){activeFilter=f;document.querySelectorAll('.pill').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');renderCards();}
function renderCards(){
  var q=document.getElementById('search').value.toLowerCase();
  var filtered=S.filter(function(s){return(activeFilter==='ALL'||s.sub===activeFilter)&&(!q||s.name.toLowerCase().includes(q)||s.desc.toLowerCase().includes(q));});
  document.getElementById('count').textContent='Showing '+filtered.length+' of '+S.length+' services';
  var grid=document.getElementById('grid'),nr=document.getElementById('no-results');
  if(!filtered.length){grid.innerHTML='';nr.style.display='block';return;}
  nr.style.display='none';
  grid.innerHTML=filtered.map(cardHTML).join('');
}
function cardHTML(s){
  var color=s.sub==='G'?'#f0c040':'#0a7b8c',tc=s.sub==='G'?'#0d2b45':'#fff';
  var at=(addons[s.id]||[]).reduce(function(sum,a){return sum+a.price;},0);
  var isExp=!!expanded[s.id],inCart=!!cart[s.id];
  return'<div class="card'+(s.bundle?' bundle':'')+'" id="card-'+s.id+'">'+
    (s.bundle?'<div class="bundle-banner">&#9733; BUNDLE &mdash; SAVE MORE</div>':'')+
    '<div class="card-body">'+
    '<span class="badge" style="background:'+color+';color:'+tc+'">'+SUBS[s.sub]+'</span>'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
    '<div class="card-title">'+s.name+'</div><div class="card-price">$'+s.price+'</div></div>'+
    '<p class="card-desc">'+s.desc+'</p>'+
    (s.inc?'<div class="bundle-inc"><strong>Includes:</strong> '+s.inc+'</div>':'')+
    '<div class="card-meta"><span>&#9201; '+s.t+'</span><span>&#9999; 2 revisions</span></div></div>'+
    '<div class="card-footer">'+
    '<button class="toggle-btn" onclick="toggleExpand(\''+s.id+'\')">'+
    (isExp?'&#9650; Hide Details':'&#9660; View Details + Add-ons')+'</button>'+
    '<div class="details'+(isExp?' open':'')+'" id="details-'+s.id+'">'+
    '<h4>Deliverables:</h4><ul>'+s.d.map(function(d){return'<li>'+d+'</li>';}).join('')+'</ul>'+
    '<h4>Required Inputs:</h4><ul>'+s.i.map(function(i){return'<li>'+i+'</li>';}).join('')+'</ul>'+
    '<h4>Add-ons:</h4>'+
    ADDONS.map(function(a){var chk=(addons[s.id]||[]).some(function(x){return x.id===a.id;});
      return'<label class="addon-item"><input type="checkbox"'+(chk?' checked':'')+' onchange="toggleAddon(\''+s.id+'\',\''+a.id+'\')"/> '+a.name+' <strong style="color:#0a7b8c">+$'+a.price+'</strong></label>';}).join('')+
    '</div>'+
    '<button class="add-btn'+(inCart?' added':'')+'" onclick="addToCart(\''+s.id+'\')">'+
    (inCart?'&#10003; In Cart':'Add to Cart &mdash; $'+(s.price+at).toLocaleString())+'</button></div></div>';
}
function toggleExpand(id){expanded[id]=!expanded[id];renderCards();}
function toggleAddon(sid,aid){
  if(!addons[sid])addons[sid]=[];
  var idx=addons[sid].findIndex(function(a){return a.id===aid;});
  if(idx>=0)addons[sid].splice(idx,1);
  else addons[sid].push(ADDONS.find(function(a){return a.id===aid;}));
  renderCards();
}
function addToCart(id){
  var svc=S.find(function(s){return s.id===id;});
  cart[id]=Object.assign({},svc,{selectedAddons:(addons[id]||[]).slice()});
  renderCart();renderCards();
  document.getElementById('cart-panel').classList.add('open');
}
function removeFromCart(id){delete cart[id];renderCart();renderCards();}
function renderCart(){
  var items=Object.values(cart);
  var total=items.reduce(function(s,i){return s+i.price+(i.selectedAddons||[]).reduce(function(a,b){return a+b.price;},0);},0);
  document.getElementById('cart-count').textContent=items.length;
  document.getElementById('cart-total').textContent=total.toLocaleString();
  var el=document.getElementById('cart-items');
  if(!items.length){el.innerHTML='<p style="color:#aaa;font-size:12px;text-align:center;padding:20px 0">No items yet.</p>';return;}
  el.innerHTML=items.map(function(item){
    return'<div class="cart-item"><div class="cart-item-name"><span>'+item.name+'</span><span>$'+item.price+'</span></div>'+
    (item.selectedAddons||[]).map(function(a){return'<div class="cart-addon"><span>+ '+a.name+'</span><span>$'+a.price+'</span></div>';}).join('')+
    '<button class="remove-btn" onclick="removeFromCart(\''+item.id+'\')">Remove</button></div>';
  }).join('')+
  '<div class="cart-total"><span>Total</span><span>$'+total.toLocaleString()+'</span></div>'+
  '<button class="checkout-btn" onclick="alert(\'Checkout coming soon!\')">Proceed to Checkout &#8594;</button>';
}
function toggleCart(){document.getElementById('cart-panel').classList.toggle('open');}
function showTab(t){
  document.getElementById('page-catalog').style.display=t==='catalog'?'':'none';
  document.getElementById('page-admin').style.display=t==='admin'?'':'none';
  document.getElementById('tab-catalog').className=t==='catalog'?'active':'';
  document.getElementById('tab-admin').className=t==='admin'?'active':'';
  if(t==='admin')renderAdmin();
}
function renderAdmin(){
  var checks=['All 8 subcategories visible in filter bar','All 42 service items appear in catalog','Filter by subcategory returns correct items only','All 4 bundles show BUNDLE badge','Each card shows price, turnaround, revision count','Expanding a card reveals deliverables + inputs + add-ons','Selecting add-ons updates cart total correctly','Add to Cart creates line item with correct price','Cart totals accurate across mixed items','Checkout button present when cart non-empty','Bundle items have gold border treatment','Search/filter works correctly'];
  document.getElementById('checklist').innerHTML=checks.map(function(c){return'<label class="checklist"><input type="checkbox"/> <span>'+c+'</span></label>';}).join('');
  var rows=Object.entries(SUBS).map(function(e){
    var id=e[0],label=e[1],items=S.filter(function(s){return s.sub===id;}),prices=items.map(function(i){return i.price;});
    return'<tr><td><span class="badge" style="background:'+(id==='G'?'#f0c040':'#0d2b45')+';color:'+(id==='G'?'#0d2b45':'#fff')+'">'+id+'</span></td><td>'+label+'</td><td style="font-weight:700;color:#0a7b8c">'+items.length+'</td><td>$'+Math.min.apply(null,prices)+'-$'+Math.max.apply(null,prices)+'</td></tr>';
  });
  var all=S.map(function(s){return s.price;});
  document.getElementById('summary-table').innerHTML='<thead><tr><th>Sub</th><th>Category</th><th>Items</th><th>Price Range</th></tr></thead><tbody>'+rows.join('')+'<tr style="background:#f0f8fa;font-weight:700"><td colspan="2" style="padding:8px 12px">TOTAL</td><td style="padding:8px 12px;color:#0a7b8c">'+S.length+'</td><td style="padding:8px 12px">$'+Math.min.apply(null,all)+'-$'+Math.max.apply(null,all)+'</td></tr></tbody>';
}
renderCards();renderCart();
</script>
</body>
</html>
